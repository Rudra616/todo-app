<!-- HEADER -->
<div class="row align-items-center mb-3">
    <div class="col-6">
        <h2 class="mb-0">Dashboard</h2>
    </div>

    <div class="col-6 text-end">
        <button class="btn btn-outline-danger logout">
            Logout
        </button>
    </div>
</div>


<p class="mb-3 text-center text-md-start">
    Welcome, <span class="user-name fw-bold">User</span>!
</p>

<!-- TASK INPUT -->
<div class="row mb-3">
    <div class="col-12 col-md-8 mb-2 mb-md-0">
        <input type="text" id="enterTask" class="form-control" placeholder="Enter task">
    </div>
    <div class="col-12 col-md-4">
        <button id="submitTask" class="btn btn-primary w-100">
            Submit
        </button>
    </div>
</div>

<!-- TABLE -->
<div class="row">
    <div class="col-12">
        <div class="table-responsive-md">
            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Task</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Opration</th>
                    </tr>
                </thead>
                <tbody id="taskTable"></tbody>
            </table>
        </div>
    </div>
</div>
