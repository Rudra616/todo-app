<div class="form-wrapper">
  <div class="form">
    <h2 class="text-center mb-4">Register</h2>
    <div class="mb-3 mt-3">
      <label for="Username" class="form-label">Username:</label>
      <input type="text" id="username" class="form-control" placeholder="Enter username" name="email">
    </div>
    <div class="mb-3">
      <label class="form-label">Password:</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control" placeholder="Password">
        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password">
          👁
        </button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirm Password:</label>
      <div class="input-group">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#confirmPassword">
          👁
        </button>
      </div>
    </div>

    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

    <button type="submit" id="register" class="btn btn-primary w-100">Register</button>

    <div class="text-center mt-3">

<a href="login.html" class="ajax-link">Already have an account? Sign in</a>
    </div>
  </div>
</div>
