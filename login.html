<div class="form-wrapper">
  <div class="form">
    <h2 class="text-center mb-4">Login</h2>

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Enter username">
    </div>

   <div class="mb-3">
      <label class="form-label">Password:</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control" placeholder="Password">
        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password">
          👁
        </button>
      </div>
    </div>


    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

    <button type="submit" id="login" class="btn btn-primary w-100">Sign in</button>

    <div class="text-center mt-3">
<a href="register.html" class="ajax-link">Don’t have an account? Sign up</a>
    </div>
  </div>
</div>
